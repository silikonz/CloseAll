name: Build with Theos

on:
  workflow_dispatch

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
      
      - name: Install SDK
        run: |
          "$THEOS/bin/install-sdk" iPhoneOS15.6
      
      - name: Build (rootless)
        env:
          SDKVERSION: "15.6"
          THEOS_PACKAGE_SCHEME: rootless
          ARCHS: "arm64 arm64e"
          FINALPACKAGE: 1
        run: |
          make clean package
          mkdir -p build/rootless
          mv ./packages/*.deb build/rootless/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
